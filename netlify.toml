# Netlify deployment for BrainStack.
#
# One site serves everything: the Next.js web app, and — under `/api` — the HTTP
# API, the auth endpoints, tRPC and the MCP endpoint AI clients connect to.
# Storage is Neon Postgres; nothing is written to disk at runtime and no process
# outlives a request.
#
# The schema migrates itself on the first request a container serves, so a
# deploy cannot land with code ahead of its database and there is nothing to
# remember to run afterwards.

[build]
  # core first: the functions resolve @brainstack/core to its compiled dist/,
  # and the function bundler runs after this command.
  command = "pnpm --filter @brainstack/core build && pnpm --filter @brainstack/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  # Nothing else goes in this block.
  #
  # Every option here — `node_bundler`, `external_node_modules`,
  # `included_files` — belongs to the older bundler, and declaring any of them
  # makes Netlify treat these .mts files as v1 functions: the runtime looks for
  # a named `handler` export and answers 502 with "D.handler is not a function",
  # even though the bundle exports `default` correctly. v2 functions are bundled
  # by Netlify's own pipeline and want to be left alone.
  #
  # `external_node_modules` was added here to keep esbuild away from the argon2
  # binary. That turned out to be the wrong cure: the `.node` file it choked on
  # was the *Windows* build, riding along in a node_modules directory that was
  # being uploaded by mistake. A clean install on Linux does not produce it.
  #
  # Nothing needs `included_files` anyway: the assistant instructions, the one
  # file the server used to read from disk, are compiled into the bundle
  # (apps/server/src/mcp/guide.ts).

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The api function declares no `path` (see the comment in api.mts): these
# rules are its only routing, so nothing races the Next.js catch-all for them.
# First match wins, and `force` keeps Next from answering with a prerendered
# 404 before the rule is consulted.

# OAuth discovery (RFC 8414/9728). Only well-known at the origin root, which
# is Next's territory — carved out here and in the web middleware's matcher.
[[redirects]]
  from = "/.well-known/oauth-protected-resource*"
  to = "/.netlify/functions/api/.well-known/oauth-protected-resource:splat"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/oauth-authorization-server*"
  to = "/.netlify/functions/api/.well-known/oauth-authorization-server:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
