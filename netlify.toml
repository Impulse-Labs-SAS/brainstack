# Netlify deployment for BrainStack.
#
# One site serves everything: the Next.js web app, and — under `/api` — the HTTP
# API, the auth endpoints, tRPC and the MCP endpoint AI clients connect to.
# Storage is Neon Postgres; nothing is written to disk at runtime and no process
# outlives a request.
#
# The schema migrates itself on the first request a container serves, so a
# deploy cannot land with code ahead of its database and there is nothing to
# remember to run afterwards.

[build]
  command = "pnpm --filter @brainstack/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  # Nothing else goes in this block.
  #
  # Every option here — `node_bundler`, `external_node_modules`,
  # `included_files` — belongs to the older bundler, and declaring any of them
  # makes Netlify treat these .mts files as v1 functions: the runtime looks for
  # a named `handler` export and answers 502 with "D.handler is not a function",
  # even though the bundle exports `default` correctly. v2 functions are bundled
  # by Netlify's own pipeline and want to be left alone.
  #
  # `external_node_modules` was added here to keep esbuild away from the argon2
  # binary. That turned out to be the wrong cure: the `.node` file it choked on
  # was the *Windows* build, riding along in a node_modules directory that was
  # being uploaded by mistake. A clean install on Linux does not produce it.
  #
  # Losing `included_files` costs the MCP `instructions` tool, which reads
  # INSTRUCTIONS.md from disk and will not find it in a bundle. One tool
  # degraded beats every route returning 502.

[[plugins]]
  package = "@netlify/plugin-nextjs"
