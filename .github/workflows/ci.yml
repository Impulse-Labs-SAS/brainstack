name: CI

# Runs on every branch, not just the ones headed for main. A branch that only
# turns green once it is proposed for merge has been red for however long it
# took to get there.

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read the code, nothing more. Pull requests from forks get a read-only token
# anyway; this says the same for every other run.
permissions:
  contents: read

jobs:
  build:
    name: lint · typecheck · test · build
    # A pull request from inside the repository has already been checked by the
    # push event on its own branch; running it twice buys nothing. Forks have no
    # push event here, so for those the pull_request run is the only one.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production dependencies only: dev tooling never reaches a server.
      # Advisories that have no fix and only touch the build are listed in
      # package.json under pnpm.auditConfig.ignoreGhsas, each one on purpose.
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level moderate

      # The root scripts, not `pnpm -r <task>`: `typecheck` builds
      # @brainstack/core first, and without its .d.ts half the server does not
      # compile — which is how the first run of this workflow failed. It also
      # covers netlify/tsconfig.json, which a recursive run never reaches.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: docker images
    # The self-host images are built by nothing else in CI. The last Dockerfile
    # ran a file that no longer started a server, and nobody found out until
    # someone tried to self-host.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the server image
        run: docker build --target server --tag brainstack-server .

      - name: Build the web image
        run: docker build --target web --tag brainstack-web .

      # Building proves the Dockerfile; this proves the image can start what
      # it says it starts. A renamed entry point used to build green.
      - name: Check the images' entry points
        run: |
          set -euo pipefail
          docker run --rm brainstack-server node --check dist/serve.js
          docker run --rm brainstack-server node --check dist/cli.js
          docker run --rm brainstack-web node --check apps/web/server.js
