name: Deploy

# Publishes to Netlify when something lands on main, after the checks pass.
#
# Deploying through the CLI rather than Netlify's Git integration means a
# failing test stops the deploy instead of shipping past it.
#
# The deploy itself is `scripts/deploy.sh`, the same script used by hand, rather
# than a second recipe maintained in YAML. The obvious
# `netlify deploy --build --prod --filter @brainstack/web` is what breaks the
# site: with a packagePath stamped on the deploy, the Next catch-all shadows the
# API function and every /api route answers 404. The script's header lists the
# other traps. One copy of that knowledge, exercised both ways.
#
# Only the upstream repository deploys; a fork that enables Actions skips the
# job instead of failing it. Configuration, in the `production` environment:
#
#   secret   NETLIFY_AUTH_TOKEN    a personal access token of the account that
#                                  owns the site (User settings > Applications)
#   secret   BRAINSTACK_SITE_ID    the Netlify site id
#   variable BRAINSTACK_SITE_URL   the production URL, e.g. https://brain.example.com
#
# DATABASE_URL, the OAuth credentials and the email settings live on the site
# itself and are pulled in at build time.

on:
  push:
    branches: [main]
  # Re-deploy the current main without needing a new commit.
  workflow_dispatch:

concurrency:
  # Never let two deploys overlap. Not cancel-in-progress: a half-finished
  # upload that gets killed is worse than a queued one.
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: verify · deploy
    if: github.repository == 'Impulse-Labs-SAS/brainstack'
    runs-on: ubuntu-latest
    environment: production
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      BRAINSTACK_SITE_ID: ${{ secrets.BRAINSTACK_SITE_ID }}
      BRAINSTACK_SITE_URL: ${{ vars.BRAINSTACK_SITE_URL }}
      # The script defaults to $HOME/brainstack, which is the WSL clone.
      BRAINSTACK_CLONE: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gate. Nothing below runs if these fail.
      # The root scripts, not `pnpm -r <task>`: `typecheck` builds
      # @brainstack/core first, and without its .d.ts half the server does not
      # compile — which is how the first run of this workflow failed. It also
      # covers netlify/tsconfig.json, which a recursive run never reaches.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Deploy to Netlify
        run: |
          set -euo pipefail
          # A missing secret is an empty string, not an error.
          for name in NETLIFY_AUTH_TOKEN BRAINSTACK_SITE_ID BRAINSTACK_SITE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty or missing in the production environment"
              exit 1
            fi
          done
          # The script builds, checks the function bundles, uploads a draft,
          # verifies the draft answers, and only then promotes it.
          bash scripts/deploy.sh publish

      # The script already checks that the live site answers on /api/config and
      # /login. This adds the one it does not: that an unauthenticated MCP call
      # is refused *by BrainStack*. The path is /api/mcp, not /mcp — bare /mcp
      # is a Next route here and redirects to the login page, which is what the
      # workflow this replaces would have checked. And the body is read, not
      # just the status: the platform can answer 401 on its own.
      - name: Smoke test the MCP endpoint
        run: |
          set -uo pipefail
          mcp=$(curl -sS -o /tmp/mcp.txt -w '%{http_code}' -X POST "$BRAINSTACK_SITE_URL/api/mcp" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' --max-time 30 || echo 000)
          echo "POST /api/mcp (no auth) -> $mcp"
          cat /tmp/mcp.txt; echo
          if [ "$mcp" != "401" ]; then
            echo "::error::/api/mcp returned $mcp for an unauthenticated call, expected 401"
            exit 1
          fi
          if ! grep -q 'unauthorized' /tmp/mcp.txt; then
            echo "::error::/api/mcp answered 401 but not from BrainStack — the request never reached the function."
            exit 1
          fi
