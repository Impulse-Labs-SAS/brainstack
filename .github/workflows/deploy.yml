name: Deploy

# Publishes to Netlify when something lands on main, after the checks pass.
#
# This is the primary deploy path, not a fallback. Netlify's Git integration
# cannot connect a repository that is both private and organization-owned
# without a Pro plan — and this one is. Deploying through the CLI sidesteps
# that: Netlify receives a build and never asks who owns the source. It also
# buys what the Git integration does not — a failing test stops the deploy
# instead of shipping past it.
#
# The deploy itself is `scripts/deploy.sh`, the same script used by hand, rather
# than a second recipe maintained in YAML. That matters here more than usual:
# the obvious `netlify deploy --build --prod --filter @brainstack/web` is what
# an earlier version of this workflow ran, and it is precisely what breaks the
# site — with a packagePath stamped on the deploy, the Next catch-all shadows
# the API function and every /api route answers 404. The script's header lists
# the other four traps. One copy of that knowledge, exercised both ways.
#
# Required secret:
#   NETLIFY_AUTH_TOKEN   A personal access token belonging to the account that
#                        owns the-site — the owning team, which has one
#                        member. Netlify → User settings → Applications.
#
# There is history here worth writing down, because the repository is the only
# place it survives. The site started under admin@example.com; that
# account ran out of deploy quota, so the live site was rebuilt as
# the-site under the personal account and stayed there. The two secrets
# still in this repository are from before that move, which is why a deploy
# that looks correctly configured fails with "the CLI cannot see the site": the
# token is valid, for a different account.
#
# It stays on the personal account deliberately. Moving it back would change
# the origin, and every MCP connector already pointing at the-site would
# have to be reconnected — a bigger cost than the one it saves.
#
# So the site id is the script's own default rather than the NETLIFY_SITE_ID
# secret, which almost certainly still holds the id of the-old-site — now
# answering 502. A deploy pointed at the wrong site does not announce itself.
# Set BRAINSTACK_SITE_ID to override. Everything else — DATABASE_URL,
# SESSION_SECRET, the OAuth credentials — lives on the site and is pulled in at
# build time.

on:
  push:
    branches: [main]
  # Re-deploy the current main without needing a new commit.
  workflow_dispatch:

concurrency:
  # Never let two deploys overlap. Not cancel-in-progress: a half-finished
  # upload that gets killed is worse than a queued one.
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: verify · deploy
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      # The script defaults to $HOME/brainstack, which is the WSL clone.
      BRAINSTACK_CLONE: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gate. Nothing below runs if these fail.
      # The root scripts, not `pnpm -r <task>`: `typecheck` builds
      # @brainstack/core first, and without its .d.ts half the server does not
      # compile — which is how the first run of this workflow failed. It also
      # covers netlify/tsconfig.json, which a recursive run never reaches.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Deploy to Netlify
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::Set NETLIFY_AUTH_TOKEN as a repository secret"
            exit 1
          fi
          # The script builds, checks the function bundles, uploads a draft,
          # verifies the draft answers, and only then promotes it.
          bash scripts/deploy.sh publish

      # The script already checks that the live site answers on /api/config and
      # /login. This adds the one it does not: that an unauthenticated MCP call
      # is refused *by BrainStack*. The path is /api/mcp, not /mcp — bare /mcp
      # is a Next route here and redirects to the login page, which is what the
      # workflow this replaces would have checked. And the body is read, not
      # just the status: the platform can answer 401 on its own.
      - name: Smoke test the MCP endpoint
        env:
          SITE_URL: https://brain.example.com
        run: |
          set -uo pipefail
          mcp=$(curl -sS -o /tmp/mcp.txt -w '%{http_code}' -X POST "$SITE_URL/api/mcp" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' --max-time 30 || echo 000)
          echo "POST /api/mcp (no auth) -> $mcp"
          cat /tmp/mcp.txt; echo
          if [ "$mcp" != "401" ]; then
            echo "::error::/api/mcp returned $mcp for an unauthenticated call, expected 401"
            exit 1
          fi
          if ! grep -q 'unauthorized' /tmp/mcp.txt; then
            echo "::error::/api/mcp answered 401 but not from BrainStack — the request never reached the function."
            exit 1
          fi
